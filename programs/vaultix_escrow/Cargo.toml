[package]
name = "vaultix_escrow"
version = "0.1.0"
description = "Vaultix P2P escrow program"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "vaultix_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"

[dev-dependencies]
# Versions match LiteSVM 0.15 (Rust 1.89, pinned by Anchor 1.2.2).
litesvm = "0.15.0"
litesvm-token = "0.15.2"
solana-clock = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
