# Lints, typechecks and tests the web app (and the root scripts) in CI so local
# machines don't have to.
name: web

on:
  push:
    paths:
      - "web/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Validates the hero shader against a real WebGPU device: CI has no GPU,
      # so vgpu's portable CPU renderer stands in for one.
      - name: Shader check
        run: |
          pnpm --filter web exec vgpu install-software-renderer
          pnpm --filter web exec vgpu check components/spectral.wgsl --require-validation

      - name: Scripts typecheck
        run: pnpm scripts:typecheck

      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Test
        run: pnpm --filter web test

      # Catches what typecheck can't (route config, prerendering). Mock mode, no secrets.
      - name: Build
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_USE_MOCK: "true"
          NEXT_TELEMETRY_DISABLED: "1"
