# Builds and tests the Anchor program in CI so local machines don't have to.
name: program

on:
  push:
    paths:
      - "programs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/program.yml"
  pull_request:
    paths:
      - "programs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/program.yml"
  workflow_dispatch:

env:
  ANCHOR_VERSION: "1.2.2"
  SOLANA_VERSION: "4.3.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml (1.89.0 + rustfmt + clippy) and caches target/.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # Restore and save are split so the tools cache is kept even when a later
      # step (tests, clippy) fails.
      - name: Restore Solana CLI and Anchor CLI
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/bin/anchor
          key: tools-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      - name: Install Solana CLI
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Install Anchor CLI
        if: steps.tools-cache.outputs.cache-hit != 'true'
        # The CLI needs a newer rustc than the program's pinned 1.89, so build it
        # outside the repo (where rust-toolchain.toml doesn't apply) with stable.
        working-directory: /tmp
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install --git https://github.com/solana-foundation/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          solana --version
          anchor --version
          rustc --version

      # The program keypair is never committed, so CI builds with a throwaway one.
      - name: Build program
        run: anchor build --ignore-keys

      # After the first build, ~/.cache/solana also holds the SBF platform tools.
      - name: Save Solana CLI and Anchor CLI
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/bin/anchor
          key: tools-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      - name: Test
        run: cargo test -p vaultix_escrow

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --check
